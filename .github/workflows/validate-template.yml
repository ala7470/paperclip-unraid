name: Validate Template

on:
  push:
    paths:
      - "unraid/**"
      - "scripts/**"
      - ".github/workflows/validate-template.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate template
        run: bash scripts/validate_template.sh
